<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/css" href="..\assets\images\logos\koyumaviesit.png">

    <style>
      .btn-hover-color {
        color: #000 !important;
        transition: color 200ms ease;
        text-decoration: none;
      }

      .btn-hover-color:hover,
      .btn-hover-color:focus,
      .btn-hover-color:active {
        color: #0360AD !important;
        text-decoration: none;
      }

      .navbar {
        height: 100px;
        width: 100%;
      }

      .navbar-toggler {
        border: none;
      }

      .navbar-toggler:focus {
        box-shadow: none;
      }

      @media (max-width: 991px) {
        .navbar-collapse {
          background: #fff;
          padding: 15px 0;
        }

        .navbar-nav,
        .navbar-collapse form {
          flex-direction: column !important;
          align-items: center !important;
          width: 100%;
          margin: 0 !important;
        }

        .navbar-collapse a {
          margin: 8px 0 !important;
          font-size: 16px;
        }

        .navbar-collapse .btn-primary {
          width: 90%;
          margin: 12px 0 0 0 !important;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>

    <nav class="navbar navbar-expand-lg sticky-top bg-white" style="box-shadow: 0 8px 25px rgba(0,0,0,0.2)">
      <div class="container-fluid">
        <a class="navbar-brand" href="#" style="color:#0360AD;font-family:monospace;">
          <img src="../assets/images/logos/koyumaviesit.png"
               style="height:80px;width:80px;border-radius:100%;margin-right:30px;margin-left:100px;">
          Randevum
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
          <form class="d-flex align-items-center" role="search"
                style="margin-right:5.5%;margin-bottom:6px">
            <a href="../index.html" class="btn btn-link btn-hover-color ms-3">Anasayfa</a>
            <a href="hakkimda.html" class="btn btn-link btn-hover-color ms-3">Hakkımda</a>
            <a href="birimlerimiz.html" class="btn btn-link btn-hover-color ms-3">Birimlerimiz</a>
            <a href="randevual.html" class="btn btn-link btn-hover-color ms-3">Randevu Al</a>
            <a class="btn btn-primary"
               href="giris.html"
               style="margin-left:25px;border-radius:15px">
              Giriş Yap
            </a>
          </form>
        </div>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row" style="text-align: center">
        <div class="col-12">
          <img src="..\assets\images\photos\kilit.png" style="width: 80px; height: 80px; border-radius: 100%; margin-top: 90px">
          <p style="color: #0360AD; font-size: 20px; margin-top: 20px"> Hasta Girişi </p>
          <p style="opacity: 0.8; font-size: 18px"> Randevularınızı görüntülemek için giriş yapın </p>
        </div>
      </div>
    </div>

    <div style="max-width: 620px; width: 95%; margin: auto;">
      
      <div class="row" style="padding-top: 5px">
        <div class="col-12">
          <p style="text-align: left; margin-bottom: 5px;"> E-posta </p>
          <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="ornek@email.com" aria-label="Username">
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <p style="text-align: left; margin-bottom: 5px;">Şifre</p>
          <div class="input-group">
            <input type="password" placeholder="Şifreniz" id="inputPassword6" class="form-control" />
            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()"> 👁 </button>
          </div>
        </div>
      </div>

      <div class="row mt-2">
        <div class="col-12 d-flex justify-content-between align-items-center" style="padding-top: 20px;">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="beniHatirla" style="border: 2px solid grey"/>
            <label class="form-check-label" for="beniHatirla"> Beni Hatırla </label>
          </div>
          <a href="" class="sifremiUnuttum" style="text-decoration: none;"> Şifremi Unuttum </a>
        </div>
      </div>

      <div class="row">
        <div class="col-12" style="text-align: center; padding-top: 20px;">
          <button type="button" class="btn btn-primary" style="width: 300px; max-width: 100%;">Giriş Yap</button>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <p style="font-size: 18px; opacity: 0.8; text-align: center; padding-top: 50px"> ----- Hesabınız yok mu? ----- </p>
        </div>
      </div>

      <div class="row">
        <div class="col-12" style="text-align: center">
          <button type="button" class="btn btn-outline-primary" style="width: 300px; max-width: 100%; margin-top: 10px; margin-bottom: 50px;">Kayıt Ol</button>
        </div>
      </div>
    </div>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("inputPassword6");
        passwordInput.type = passwordInput.type === "password" ? "text" : "password";
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
